<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cribrum labeling</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  main { height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; }
  img { max-width: 100vw; max-height: calc(100vh - 64px); object-fit: contain; }
  footer { height: 64px; padding: 6px 12px; box-sizing: border-box; background: #222; }
  #path { color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.keep { color: #6c6; } #status.delete { color: #e66; }
  kbd { background: #333; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<main><img id="image" alt=""></main>
<footer>
  <div><span id="progress"></span> · <span id="status"></span></div>
  <div id="keys"></div>
  <div id="path"></div>
</footer>
<script>
let items = [], categories = {}, position = 0, history = [], labeled = 0;

async function post(url, body) {
  const response = await fetch(url, {method: "POST", body: JSON.stringify(body)});
  if (!response.ok) throw new Error(await response.text());
}

function show() {
  if (position >= items.length) {
    document.getElementById("image").removeAttribute("src");
    document.getElementById("status").textContent = "done: every image in the sample is labeled";
    return;
  }
  document.getElementById("image").src = `/image/${position}`;
  document.getElementById("path").textContent = items[position].path;
  document.getElementById("progress").textContent =
    `${position + 1} / ${items.length} · ${labeled} labeled this session`;
  for (let ahead = 1; ahead <= 3 && position + ahead < items.length; ahead++) {
    new Image().src = `/image/${position + ahead}`;  // preload: no wait between images
  }
}

function setStatus(text, kind) {
  const status = document.getElementById("status");
  status.textContent = text;
  status.className = kind || "";
}

async function label(decision, category) {
  if (position >= items.length) return;
  await post("/api/label", {item: position, decision, category});
  history.push(position);
  labeled++;
  setStatus(category ? `${decision}: ${category}` : decision, decision);
  position++;
  show();
}

async function undo() {
  if (!history.length) return;
  position = history.pop();
  await post("/api/unlabel", {item: position});
  labeled--;
  setStatus("undone");
  show();
}

document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.toLowerCase();
  let action = null;
  if (key === "k") action = label("keep");
  else if (key === "d") action = label("delete");
  else if (categories[key]) action = label("delete", categories[key]);
  else if (key === "u" || key === "backspace") action = undo();
  else if (key === "s" && position < items.length) { position++; setStatus("skipped"); show(); }
  if (action) action.catch(error => setStatus(`error: ${error.message}`, "delete"));
});

document.getElementById("image").addEventListener("error", () => {
  if (position < items.length) setStatus("this image can't be decoded: s to skip it", "delete");
});

fetch("/api/queue").then(r => r.json()).then(queue => {
  items = queue.items;
  categories = queue.categories;
  const digits = Object.entries(categories).map(([k, c]) => `<kbd>${k}</kbd> ${c}`).join(" ");
  document.getElementById("keys").innerHTML =
    `<kbd>k</kbd> keep · <kbd>d</kbd> delete · ${digits} · <kbd>u</kbd> undo · <kbd>s</kbd> skip`;
  show();
});
</script>
</body>
</html>
