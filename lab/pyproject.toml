[project]
name = "cribrum-lab"
version = "0.1.0"
description = "Prototype and reference implementation of Cribrum's detectors"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "tokenizers>=0.23.3",
    "xxhash>=4.0.1",
]

[project.scripts]
cribrum-lab = "cribrum_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cribrum_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
