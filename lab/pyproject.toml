[project]
name = "cribrum-lab"
version = "0.1.0"
description = "Prototype and reference implementation of Cribrum's detectors"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cribrum_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

