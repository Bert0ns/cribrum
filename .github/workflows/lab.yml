name: lab

on:
  push:
    branches: [main]
    paths: ["lab/**", "fixtures/**", ".github/workflows/lab.yml"]
  pull_request:
    paths: ["lab/**", "fixtures/**", ".github/workflows/lab.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
